[project]
name = "cloud-storage-service"
version = "0.1.0"
description = "FastAPI HTTP service exposing the cloud storage client API"
readme = "README.md"
requires-python = ">=3.14"  # team5-calendar requires 3.14
dependencies = [
    "calendar-contract",
    "cloud-storage-client-api",
    "course-autopilot-store",
    "dropbox-client-impl",
    "fastapi>=0.115.0",
    "google-auth>=2.30",
    "httpx>=0.28,<1",
    "issue-tracker-contract",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-requests>=0.66b1",
    "opentelemetry-propagator-gcp>=1.15.0",
    "opentelemetry-sdk>=1.45.1",
    "pypdf>=6.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.36",
    "team-4-issue-tracker-trello",
    "team5-calendar",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_storage_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/cloud_storage_service/py.typed" = "cloud_storage_service/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
extend = "../../pyproject.toml"

[tool.ruff.lint]
ignore = []

[tool.uv.sources]
cloud-storage-client-api = { workspace = true }
dropbox-client-impl = { workspace = true }
course-autopilot-store = { workspace = true }
# HW3: other teams' implementations and the shared contracts they implement, each pinned to
# a tag. `rev` matches the direct Git references inside Team 4's and Team 5's packages.
calendar-contract = { git = "https://github.com/Airbus-A330/OSPSD-Calendar.git", rev = "v0.1.0" }
issue-tracker-contract = { git = "https://github.com/Tyler-Arciniaga/OSPSD-Team-4.git", rev = "issue-tracker-contract-v1.1.0", subdirectory = "contract" }
team-4-issue-tracker-trello = { git = "https://github.com/Tyler-Arciniaga/OSPSD-Team-4.git", tag = "team-4-issue-tracker-trello-v1.1.0", subdirectory = "team-4-trello-impl" }
team5-calendar = { git = "https://github.com/juno-junhyuk-lee/OSPSD-Team-5.git", tag = "team5-calendar-v0.1.0", subdirectory = "packages/team5-calendar" }
