[project]
name = "cloud-storage-service"
version = "0.1.0"
description = "FastAPI HTTP service exposing the cloud storage client API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cloud-storage-client-api",
    "dropbox-client-impl",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_storage_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/cloud_storage_service/py.typed" = "cloud_storage_service/py.typed"

[tool.ruff]
line-length = 100
target-version = "py311"
extend = "../../pyproject.toml"

[tool.ruff.lint]
ignore = []

[tool.uv.sources]
cloud-storage-client-api = { workspace = true }
dropbox-client-impl = { workspace = true }
