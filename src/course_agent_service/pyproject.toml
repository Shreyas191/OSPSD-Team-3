[project]
name = "course-agent-service"
version = "0.1.0"
description = "Agent service for Course Autopilot: the model loop between the interface and the API service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=2.34,<3",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_agent_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/course_agent_service/py.typed" = "course_agent_service/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
extend = "../../pyproject.toml"
