[project]
name = "dropbox-client-impl"
version = "0.1.0"
description = "Dropbox implementation of the cloud storage client API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cloud-storage-client-api",
    "dropbox>=12.0.2",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests", "src"]
addopts = ["--cov", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", ]

[tool.coverage.report]
fail_under = 85 # Justification: A high threshold ensures most code is tested.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dropbox_client_impl"]

[tool.hatch.build.targets.wheel.force-include]
"src/dropbox_client_impl/py.typed" = "dropbox_client_impl/py.typed"

[tool.ruff]
line-length = 100  # Default formatting width
target-version = "py311"  # Adjust based on actual Python version
extend = "../../pyproject.toml"

[tool.ruff.lint]
ignore = []

[tool.uv.sources]
cloud-storage-client-api = { workspace = true }
