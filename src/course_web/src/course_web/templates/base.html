<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Course Autopilot{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --text: #1d1d1f; --muted: #5f6368; --bg: #ffffff; --line: #dadce0; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #e8eaed; --muted: #a8adb3; --bg: #16181b; --line: #3c4043; }
    }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; }
    h1 { font-size: 2rem; margin: 0 0 1rem; }
    footer { max-width: 40rem; margin: 0 auto; padding: 1rem; border-top: 1px solid var(--line);
             color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
  <footer>Course Autopilot · release <code>{{ release }}</code></footer>
</body>
</html>
