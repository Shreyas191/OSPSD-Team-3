<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Course Autopilot{% endblock %}</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  {% if signed_in %}
  <header>
    <nav><a href="/">Course Autopilot</a> <a href="/connections">Connections</a></nav>
    <form method="post" action="/sign-out">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="quiet">Sign out</button>
    </form>
  </header>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
  <footer>Course Autopilot · release <code>{{ release }}</code></footer>
</body>
</html>
