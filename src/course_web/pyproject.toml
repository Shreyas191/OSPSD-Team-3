[project]
name = "course-web"
version = "0.1.0"
description = "Interface for Course Autopilot: server-rendered pages in front of the agent and API services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_web"]

[tool.hatch.build.targets.wheel.force-include]
"src/course_web/py.typed" = "course_web/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
extend = "../../pyproject.toml"
