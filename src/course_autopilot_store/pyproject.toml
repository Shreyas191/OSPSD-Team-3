[project]
name = "course-autopilot-store"
version = "0.1.0"
description = "Course Autopilot's persisted state: tables, migrations and database access"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_autopilot_store"]

[tool.hatch.build.targets.wheel.force-include]
"src/course_autopilot_store/py.typed" = "course_autopilot_store/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
extend = "../../pyproject.toml"
