[project]
name = "cloud-storage-client-api"
version = "0.1.0"
description = "Abstract cloud storage client contract (Client and File ABCs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_storage_client_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/cloud_storage_client_api/py.typed" = "cloud_storage_client_api/py.typed"

[tool.ruff]
line-length = 100  # Default formatting width
target-version = "py311"  # Adjust based on actual Python version
extend = "../../pyproject.toml"

[tool.ruff.lint]
ignore = []

