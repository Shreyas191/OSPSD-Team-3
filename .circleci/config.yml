# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Google Cloud settings for releases. None of them is a secret: the deploy jobs sign in with
# CircleCI's short-lived OIDC token (infra/ci.tf), so no Google key is stored in CircleCI.
# The token only exists in jobs that use a context, which is why they use `gcp-deploy`.
commands:
  gcp_sign_in:
    description: "Exchange CircleCI's OIDC token for a short-lived token of the deployer service account"
    steps:
      - run:
          name: "Sign in to Google Cloud as the deployer (no stored key)"
          command: |
            echo "$CIRCLE_OIDC_TOKEN_V2" > /tmp/circleci-oidc-token
            gcloud iam workload-identity-pools create-cred-config \
              "projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/circleci/providers/circleci" \
              --service-account="storage-deployer@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
              --credential-source-file=/tmp/circleci-oidc-token \
              --output-file=/tmp/gcp-credentials.json
            gcloud auth login --cred-file=/tmp/gcp-credentials.json --quiet
            gcloud config set project "${GCP_PROJECT_ID}"
            gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

# Define jobs to be invoked later in a workflow.
jobs:
  # Job 1: Setup Environment and Install All Dependencies
  build:
    docker:
      - image: cimg/python:3.12 # Use a consistent Python version
    steps:
      - checkout
      - run:
          name: "Install UV and Add to Path"
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            uv --version # Verify installation
      - run:
          name: "Create Virtual Env & Install All Dependencies via UV Sync"
          command: |
            # Create venv in the default .venv location
            uv venv --python 3.12
            source .venv/bin/activate
            # Install all dependencies including dev/test extras
            uv sync --all-packages --extra dev --verbose
      - run:
          name: "Verify Installation (Optional)"
          command: |
            source .venv/bin/activate
            uv tree # Check if workspace members and tools are listed
            ruff --version
            pytest --version
            mypy --version
            coverage --version
      - persist_to_workspace:
          # Persist the entire project directory, including the populated .venv
          root: .
          paths:
            - .

  # Job 2: Linting and Formatting Checks
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - attach_workspace:
          at: . # Attach the workspace persisted from 'build'
      - run:
          name: "Run Linting and Formatting Checks"
          command: |
            source .venv/bin/activate # Activate the venv from the workspace
            ruff check .
            ruff format --check .

  # Job 3: Unit Tests and Coverage (Fast, No External Dependencies)
  unit_test:
    docker:
      - image: cimg/python:3.12
    steps:
      - attach_workspace:
          at: . # Attach the workspace persisted from 'build'
      - run:
          name: "Activate Venv and Create Test Results Directory"
          command: |
            source .venv/bin/activate
            mkdir -p test-results/unit # Create directory for JUnit XML
      - run:
          name: "Execute Unit Test Suite (src/ tests only)"
          command: |
            source .venv/bin/activate
            # Run only unit tests from src/ directories (fast, isolated tests)
            pytest src/ --cov=src --cov-report=xml --cov-report=term \
                     --junitxml=test-results/unit/junit.xml \
                     --cov-fail-under=85
      - run:
          name: "Run Static Analysis (mypy)"
          command: |
            source .venv/bin/activate
            # Type-check source and test code (settings in pyproject.toml)
            mypy src tests
      - store_test_results:
          path: test-results/unit
      - store_artifacts: # Store coverage reports
          path: coverage.xml
      - store_artifacts:
          path: test-results/unit

  # Job 4: CircleCI Integration Tests (All Tests Except Local Credentials)
  circleci_test:
    docker:
      - image: cimg/python:3.12
    # Environment variables from the 'dropbox-client' context will be available here
    steps:
      - attach_workspace:
          at: . # Attach the workspace persisted from 'build'
      - run:
          name: "Activate Venv and Create Test Results Directory"
          command: |
            source .venv/bin/activate
            mkdir -p test-results/circleci # Separate directory for results
      - run:
          name: "Execute All Tests Except Local Credentials"
          command: |
            source .venv/bin/activate
            # Run all tests from src/ and tests/ directories except those requiring local credentials
            # This includes unit tests, integration tests, and e2e tests that work with env vars
            # Coverage tracking enabled since this includes comprehensive unit tests
            pytest src/ tests/ -m "not local_credentials" \
                   --junitxml=test-results/circleci/junit.xml -v \
                   --cov=src --cov-report=term
      - store_test_results:
          path: test-results/circleci
      - store_artifacts:
          path: test-results/circleci

  # Job 5: Integration Tests with Real Credentials (Optional - Branch Restricted)
  integration_test:
    docker:
      - image: cimg/python:3.12
    # Environment variables from the 'dropbox-client' context will be available here
    steps:
      - attach_workspace:
          at: . # Attach the workspace persisted from 'build'
      - run:
          name: "Verify Environment Variables"
          command: |
            echo "Checking for required environment variables..."
            # This job only runs on main and dev, where the real-Dropbox tests must run.
            # Without credentials they would all be skipped and the job would still pass.
            if [ -z "$DROPBOX_APP_KEY" ] || [ -z "$DROPBOX_APP_SECRET" ] || [ -z "$DROPBOX_REFRESH_TOKEN" ]; then
              echo "ERROR: Missing Dropbox environment variables; the integration tests would be skipped."
              echo "Required in the 'dropbox-client' context: DROPBOX_APP_KEY, DROPBOX_APP_SECRET, DROPBOX_REFRESH_TOKEN"
              exit 1
            else
              echo "All required environment variables are present."
            fi
      - run:
          name: "Activate Venv and Create Test Results Directory"
          command: |
            source .venv/bin/activate
            mkdir -p test-results/integration # Separate directory for results
      - run:
          name: "Execute Integration Test Suite with Real API Calls"
          command: |
            source .venv/bin/activate
            # Run integration tests that require real Dropbox API connectivity
            # These will use environment variables for authentication
            # Note: No coverage tracking for integration tests - they test component interactions
            pytest -m "integration and not local_credentials" \
                   --junitxml=test-results/integration/junit.xml -v \
                   --no-cov
      - store_test_results:
          path: test-results/integration
      - store_artifacts:
          path: test-results/integration

  # Job 6: Report Summary
  report_summary:
    docker:
      - image: cimg/base:stable # Use a basic image for reporting
    steps:
      - attach_workspace:
          at: . # Attach the workspace
      - run:
          name: "Summarize Unit Test Results"
          command: |
            echo "--- Unit Test Summary ---"
            if [ -f test-results/unit/junit.xml ]; then
              echo "Unit test results file found."
              # Extract test count if possible
              if command -v xmllint > /dev/null; then
                tests=$(xmllint --xpath "string(//testsuite/@tests)" test-results/unit/junit.xml 2>/dev/null || echo "N/A")
                failures=$(xmllint --xpath "string(//testsuite/@failures)" test-results/unit/junit.xml 2>/dev/null || echo "N/A")
                echo "Tests: $tests, Failures: $failures"
              fi
            else
              echo "Unit test results file (test-results/unit/junit.xml) not found."
            fi
      - run:
          name: "Summarize CircleCI Test Results"
          command: |
            echo "--- CircleCI Test Summary ---"
            if [ -f test-results/circleci/junit.xml ]; then
              echo "CircleCI test results file found."
            else
              echo "CircleCI test results file not found."
            fi
      - run:
          name: "Summarize Integration Test Results"
          command: |
            echo "--- Integration Test Summary ---"
            if [ -f test-results/integration/junit.xml ]; then
              echo "Integration test results file found."
            else
              echo "Integration test results file not found."
            fi
      - run:
          name: "Display Coverage Info"
          command: |
            echo "--- Coverage Summary ---"
            if [ -f coverage.xml ]; then
               echo "Coverage XML found. Check artifacts for details."
               # Extract overall line rate if xmllint is available
               if command -v xmllint > /dev/null; then
                 coverage_rate=$(xmllint --xpath "string(//coverage/@line-rate)" coverage.xml 2>/dev/null || echo "N/A")
                 echo "Line Coverage Rate: $coverage_rate"
               fi
            else
               echo "Coverage XML not found."
            fi

  # Job 7: Build the release image once, from this commit and uv.lock, and push it.
  release_image:
    machine:
      image: ubuntu-2404:current
    environment: &gcp
      GCP_PROJECT_ID: ospsd-team3
      GCP_PROJECT_NUMBER: "423718180353"
      REGION: us-central1
      IMAGE_REPO: us-central1-docker.pkg.dev/ospsd-team3/cloud-storage-service/cloud-storage-service
    steps:
      - checkout
      - gcp_sign_in
      - run:
          name: "Build the image tagged with the commit SHA and push it"
          command: |
            scripts/build_image.sh "${IMAGE_REPO}"
            docker push "${IMAGE_REPO}:${CIRCLE_SHA1}"

  # Job 8: Deploy that exact image, by digest, to one environment, then smoke-check it.
  # Traffic moves to the new revision only if the smoke check passes (scripts/deploy.sh).
  deploy:
    parameters:
      environment:
        type: enum
        enum: ["test", "demo"]
    machine:
      image: ubuntu-2404:current
    environment: *gcp
    steps:
      - checkout
      - gcp_sign_in
      - run:
          name: "Install uv for the smoke check"
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: "Deploy << parameters.environment >> and smoke-check it"
          command: |
            digest="$(gcloud artifacts docker images describe "${IMAGE_REPO}:${CIRCLE_SHA1}" \
              --format='value(image_summary.digest)')"
            scripts/deploy.sh << parameters.environment >> "${IMAGE_REPO}@${digest}" "${CIRCLE_SHA1}"

  # Job 9: The vertical's shared conformance suite, against our real HTTP app running on an
  # in-memory storage client (tests/memory_client.py). No network, no credentials.
  conformance:
    docker:
      - image: cimg/python:3.12
    environment:
      # The suite isn't merged in Dayana20/ospsd26-cloud-storage yet (its PR #6), so it is
      # pinned to Team 6's commit. Move the pin when the suite is merged and tagged.
      CONFORMANCE_REPO: https://github.com/prateeks99/ospsd26-cloud-storage.git
      CONFORMANCE_COMMIT: b77617c218d345c8cde28dbf08cf4d1a5cbaef38
    steps:
      - attach_workspace:
          at: .
      - run:
          name: "Fetch the pinned conformance suite"
          command: |
            git clone --quiet "${CONFORMANCE_REPO}" /tmp/shared
            git -C /tmp/shared checkout --quiet "${CONFORMANCE_COMMIT}"
            # The suite imports httpx2 for the httpx API; point that name at the httpx we
            # already lock instead of installing an extra, unvetted package.
            mkdir -p /tmp/shim
            printf 'import sys\n\nimport httpx\n\nsys.modules[__name__] = httpx\n' > /tmp/shim/httpx2.py
      - run:
          name: "Start the app on the in-memory client"
          background: true
          command: |
            source .venv/bin/activate
            python scripts/serve_in_memory.py 8000
      - run:
          name: "Run the conformance suite against it"
          command: |
            source .venv/bin/activate
            for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
            mkdir -p test-results/conformance
            CONFORMANCE_BASE_URL=http://127.0.0.1:8000 \
            PYTHONPATH=/tmp/shim:/tmp/shared:/tmp/shared/src/cloud_storage_api/src \
              pytest /tmp/shared/conformance/tests -c /dev/null --rootdir /tmp/shared -p no:cacheprovider \
                     --junitxml=test-results/conformance/junit.xml -v
      - store_test_results:
          path: test-results/conformance

  # Job 10: Check the OpenTofu code without touching the cloud: formatting and validity.
  infra_validate:
    docker:
      - image: cimg/base:stable
    environment:
      TOFU_VERSION: 1.13.9
    steps:
      - checkout
      - run:
          name: "Install OpenTofu ${TOFU_VERSION}"
          command: |
            curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh
            sh /tmp/install-opentofu.sh --install-method standalone --opentofu-version "${TOFU_VERSION}" \
              --install-path "$HOME/bin" --symlink-path -   # verifies the download's signature with GPG
            echo 'export PATH="$HOME/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: "tofu fmt -check and tofu validate (no backend, no credentials)"
          command: |
            tofu fmt -check -recursive infra
            cd infra
            tofu init -backend=false -input=false
            tofu validate

# Orchestrate jobs using workflows
workflows:
  # Main workflow: Build, Lint, Test (runs on all branches except main/dev)
  build_and_test:
    jobs:
      - build:
          filters:
            branches:
              ignore:
                - main
                - dev
      - lint:
          requires:
            - build
          filters:
            branches:
              ignore:
                - main
                - dev

      - unit_test:
          requires:
            - build
          filters:
            branches:
              ignore:
                - main
                - dev

      - circleci_test:
          requires:
            - unit_test # Run after unit tests pass
          filters:
            branches:
              ignore:
                - main
                - dev

      # Optional: Report summary after core tests
      - report_summary:
          requires:
            - unit_test
            - circleci_test
          filters:
            branches:
              ignore:
                - main
                - dev

      - conformance:
          requires:
            - build
          filters:
            branches:
              ignore:
                - main
                - dev
      - infra_validate:
          filters:
            branches:
              ignore:
                - main
                - dev

      # Release: every push to hw2 that passed the checks above ships to the test service.
      - release_image:
          requires: [lint, unit_test, circleci_test, conformance, infra_validate]
          context: gcp-deploy
          filters:
            branches:
              only: hw2
      - deploy:
          name: deploy_test
          environment: test
          requires: [release_image]
          context: gcp-deploy
          filters:
            branches:
              only: hw2

  # Enhanced workflow: Full tests with real credentials (main/dev only)
  full_integration:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
                - dev

      - lint:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - dev

      - unit_test:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - dev

      - circleci_test:
          requires:
            - unit_test
          filters:
            branches:
              only:
                - main
                - dev

      - integration_test:
          requires:
            - circleci_test # Run after CircleCI tests pass
          context: dropbox-client # Context containing Dropbox API credentials
          filters:
            branches:
              only:
                - main
                - dev
                
      - report_summary:
          requires:
            - unit_test
            - circleci_test
            - integration_test
          filters:
            branches:
              only:
                - main
                - dev

      - conformance:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - dev
      - infra_validate:
          filters:
            branches:
              only:
                - main
                - dev

      # Release: main ships to test first, and to demo only if test passed its smoke check.
      - release_image:
          requires: [lint, unit_test, circleci_test, integration_test, conformance, infra_validate]
          context: gcp-deploy
          filters:
            branches:
              only: main
      - deploy:
          name: deploy_test
          environment: test
          requires: [release_image]
          context: gcp-deploy
          filters:
            branches:
              only: main
      - deploy:
          name: deploy_demo
          environment: demo
          requires: [deploy_test]
          context: gcp-deploy
          filters:
            branches:
              only: main

